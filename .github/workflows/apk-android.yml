# Fabrication de l'APK Android sur les machines de GitHub.
#
# Remplace les compilations EAS, dont le quota gratuit est epuise chaque mois. Le resultat est
# identique : c'est le meme projet Expo, compile avec les memes outils, mais sur une machine
# GitHub plutot que sur les serveurs d'Expo.
#
# Lancement : onglet « Actions » du depot -> « APK Android » -> « Run workflow ».
# L'APK se recupere en bas de la page de l'execution, dans « Artifacts ».
name: APK Android

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # La PREMIERE compilation est longue : Gradle, le SDK Android et la compilation C++ de
    # MapLibre partent de zero, sans aucun cache. Les suivantes reutilisent le cache ci-dessous
    # et durent beaucoup moins. Deux heures laissent de la marge meme sur une machine lente.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # Java 17 : version exigee par Gradle 8 et le greffon Android.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache de Gradle et des objets C++ deja compiles. Restauration et sauvegarde sont
      # SEPAREES a dessein : avec l'action complete, rien n'est conserve quand la compilation
      # est interrompue — or c'est precisement ce cas qui s'est produit, et le travail deja
      # fait etait perdu a chaque fois.
      - uses: actions/cache/restore@v4
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Dependances
        working-directory: apps/mobile
        run: npm ci

      # `prebuild` regenere le dossier android/ a partir de app.json. Il n'est volontairement
      # pas conserve dans le depot : il se reconstruit a l'identique a chaque fois, et le
      # garder reviendrait a versionner des milliers de fichiers generes.
      - name: Generer le projet Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Signature. Sans les secrets, l'APK est signe avec la cle de developpement d'Android :
      # il s'installe et fonctionne, mais PAS par-dessus une version signee autrement.
      - name: Signature
        working-directory: apps/mobile
        env:
          WIN_KEYSTORE_BASE64: ${{ secrets.WIN_KEYSTORE_BASE64 }}
          WIN_KEYSTORE_PASSWORD: ${{ secrets.WIN_KEYSTORE_PASSWORD }}
          WIN_KEY_ALIAS: ${{ secrets.WIN_KEY_ALIAS }}
          WIN_KEY_PASSWORD: ${{ secrets.WIN_KEY_PASSWORD }}
        run: node scripts/ci-signing.mjs

      # Les mots de passe sont lus par Gradle depuis l'environnement, jamais ecrits dans un
      # fichier du projet (voir scripts/ci-signing.mjs).
      - name: Compiler l'APK
        working-directory: apps/mobile/android
        env:
          WIN_KEYSTORE_PASSWORD: ${{ secrets.WIN_KEYSTORE_PASSWORD }}
          WIN_KEY_ALIAS: ${{ secrets.WIN_KEY_ALIAS }}
          WIN_KEY_PASSWORD: ${{ secrets.WIN_KEY_PASSWORD }}
        # `reactNativeArchitectures=arm64-v8a` : LE reglage decisif. Par defaut, tout le code
        # C++ (Reanimated, SVG, MapLibre) est compile pour QUATRE architectures — arm64-v8a,
        # armeabi-v7a, x86 et x86_64 — soit quatre fois le meme travail. Sur une machine a deux
        # coeurs, la compilation depassait deux heures et se faisait couper. arm64-v8a couvre
        # tous les telephones Android vendus depuis une dizaine d'annees ; les deux x86 ne
        # servent qu'aux emulateurs. Ajouter armeabi-v7a le jour ou un telephone 32 bits doit
        # etre pris en charge.
        #
        # `--no-daemon` : inutile de garder un processus Gradle vivant sur une machine jetable.
        # `-x lint` : l'analyse statique ajoute plusieurs minutes sans rien apporter ici — le
        # projet est deja verifie par TypeScript en amont.
        run: ./gradlew assembleRelease --no-daemon -x lint -PreactNativeArchitectures=arm64-v8a

      # `if: always()` : le cache est conserve meme apres un echec, pour que l'essai suivant
      # reparte du travail deja fait plutot que de tout recompiler.
      - uses: actions/cache/save@v4
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.cxx
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/package-lock.json') }}

      - name: Version
        id: version
        working-directory: apps/mobile
        run: echo "code=$(node -p "require('./app.json').expo.android.versionCode")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: win-v${{ steps.version.outputs.code }}-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
