# -----------------------------------------------------------------------------
# Nouvelle API WIN — bloc a AJOUTER dans le server { } HTTPS existant de
# /etc/nginx/sites-available/default
#
# A coller juste avant l'accolade fermante du bloc `server` qui ecoute en 443.
# N'ajoute rien qui touche `/`, `/api/`, `/uploads/`, `/socket.io/` ni
# `/valhalla/` : la v83 continue de fonctionner exactement comme avant.
#
# Sauvegarde obligatoire avant modification :
#   sudo cp /etc/nginx/sites-available/default ~/sauvegardes/nginx-default-$(date +%F).bak
# -----------------------------------------------------------------------------

# Temps reel de l'application native. Doit venir AVANT /v2/ : nginx choisit le
# prefixe le plus long, donc ce bloc l'emporte pour les connexions websocket.
location /v2/socket.io/ {
    proxy_pass http://127.0.0.1:3002/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Toutes les autres routes de la nouvelle API.
# Le `/` final de proxy_pass retire le prefixe : /v2/places -> /places.
location /v2/ {
    proxy_pass http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # Les photos de lieux arrivent par ici.
    client_max_body_size 20m;
}
